<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziorse - Profil Düzenle</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/profile-edit.css">
  <script src="js/lib/lucide.min.js"></script>
  <script src="js/lib/socket.io.min.js"></script>
  <script src="js/data-store.js"></script>
  <script>
    if (typeof io !== 'undefined') {
      window.socket = io('http://localhost:3000');
    }
    const dsCheck = (window.parent && window.parent !== window && window.parent.dataStore)
      ? window.parent.dataStore
      : window.dataStore;
    if (!dsCheck || !dsCheck.isLoggedIn()) {
      window.location.replace('login.html');
    }
  </script>
</head>

<body class="profile-edit-body">

  <!-- TITLEBAR -->
  <div class="app-header">
    <div class="header-brand">
      <span class="brand-badge-title">ZIORSE</span>
      <span class="header-location-breadcrumb">– Profil Ayarları</span>
    </div>
  </div>

  <!-- ANA ICERIK -->
  <div class="pe-wrapper">

    <div class="pe-card">

      <!-- SAG UST KAPAT ALANI -->
      <div class="pe-close-area">
        <button id="btn-close-profile-edit" class="pe-close-btn" title="Ana sayfaya dön">
          <i data-lucide="x" style="width:16px; height:16px;"></i>
        </button>
        <span class="pe-esc-label">ESC</span>
      </div>

      <!-- BASLIK -->
      <div class="pe-card-header">
        <div>
          <h2 class="pe-title">Profil Ayarları</h2>
          <p class="pe-subtitle">Adınızı, biyografinizi, avatarı ve kapak görselini güncelleyin.</p>
        </div>
      </div>

      <!-- FORM -->
      <div class="pe-form">

        <!-- BANNER -->
        <div class="pe-field-group">
          <label class="pe-label">Kapak Görseli (Banner)</label>
          <div id="pe-banner-preview" class="pe-banner-preview"></div>
          <button id="btn-pe-pick-banner" class="pe-upload-btn">
            <i data-lucide="image" style="width:14px; height:14px;"></i>
            Galeriden Seç
          </button>
          <input type="file" id="pe-file-banner" accept="image/*" style="display:none;">
        </div>

        <!-- AVATAR -->
        <div class="pe-field-group">
          <label class="pe-label">Profil Fotoğrafı</label>
          <div class="pe-avatar-row">
            <img id="pe-avatar-preview" class="pe-avatar-preview" src="" alt="Avatar">
            <button id="btn-pe-pick-avatar" class="pe-upload-btn">
              <i data-lucide="image" style="width:14px; height:14px;"></i>
              Galeriden Seç
            </button>
          </div>
          <input type="file" id="pe-file-avatar" accept="image/*" style="display:none;">
        </div>

        <!-- ISIM -->
        <div class="pe-field-group">
          <label class="pe-label" for="pe-input-name">İsim Soyisim</label>
          <input type="text" id="pe-input-name" class="pe-input" placeholder="Adınız Soyadınız">
        </div>

        <!-- KULLANICI ADI -->
        <div class="pe-field-group">
          <label class="pe-label" for="pe-input-handle">Kullanıcı Adı (@)</label>
          <input type="text" id="pe-input-handle" class="pe-input" placeholder="@kullanici">
        </div>

        <!-- BIYOGRAFI -->
        <div class="pe-field-group">
          <label class="pe-label" for="pe-input-bio">Biyografi</label>
          <textarea id="pe-input-bio" class="pe-textarea" rows="3"
            placeholder="Kendinizden ve ilgi alanlarınızdan bahsedin..."></textarea>
        </div>

      </div>
      <!-- /FORM -->

    </div>
    <!-- /CARD -->

  </div>
  <!-- /WRAPPER -->

  <!-- DEGISIKLIK KAYDET / GERI AL CUBUGU (baslangicta gizli) -->
  <div id="pe-change-bar" class="pe-change-bar pe-change-bar--hidden">
    <span class="pe-change-bar-text">Kaydedilmemiş değişiklikleriniz var.</span>
    <div class="pe-change-bar-actions">
      <button id="btn-pe-discard" class="pe-btn-discard">Geri Al</button>
      <button id="btn-pe-save" class="pe-btn-save">Değişiklikleri Kaydet</button>
    </div>
  </div>

  <div id="pe-toast-container" class="pe-toast-container"></div>

  <script src="js/image-cropper.js"></script>
  <script src="js/profile-edit.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziorse - Profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Audiowide&family=Bebas+Neue&family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Fira+Code:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Modak&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Nabla:EDPT,EHLT@0..200,0..100&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Orbitron:wght@600;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&family=Press+Start+2P&family=Righteous&family=Russo+One&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@600;700&family=Syne:wght@700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/profile-view.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('ziorse_theme') || localStorage.getItem('ziorse_theme_v14') || localStorage.getItem('ziorse_theme_preference');
        if (t === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch(e) {}
    })();
  </script>
  <script src="js/lib/lucide.min.js"></script>
  <script src="js/lib/socket.io.min.js"></script>
  <script src="js/data-store.js"></script>
  <script>
    if (typeof io !== 'undefined') {
      window.socket = io('http://localhost:3000');
    }
    if (!window.dataStore || !window.dataStore.isLoggedIn()) {
      window.location.replace('login.html');
    }
  </script>
</head>

<body class="profile-view-body">

  <!-- TITLEBAR -->
  <div class="app-header">
    <div class="header-brand">
      <span class="brand-badge-title">ZIORSE</span>
      <span id="pv-titlebar-breadcrumb" class="header-location-breadcrumb">– Profil</span>
    </div>
  </div>

  <!-- SAYFA ICERIK -->
  <div class="pv-page">

    <!-- SAG UST KAPAT ALANI -->
    <div class="pv-close-area">
      <button id="btn-close-profile-view" class="pv-close-btn" title="Geri dön">
        <i data-lucide="x" style="width:16px; height:16px;"></i>
      </button>
      <span class="pv-esc-label">ESC</span>
    </div>

    <!-- SOL: Profil kart + sabit -->
    <aside class="pv-sidebar">

      <!-- BANNER + AVATAR KARTI -->
      <div class="pv-profile-card">
        <div id="pv-banner" class="pv-banner"></div>
        <div class="pv-avatar-wrap" id="pv-avatar-wrap" style="position:relative; overflow:visible;">
          <img id="pv-avatar" class="pv-avatar" src="" alt="Avatar">
          <img id="pv-avatar-frame-overlay" class="global-avatar-frame-overlay" src="" alt="" style="display:none;">
          <div class="pv-status-dot"></div>
        </div>
        <div class="pv-identity">
          <h2 id="pv-name" class="pv-name"></h2>
          <span id="pv-handle" class="pv-handle"></span>
          <span id="pv-custom-status" class="pv-custom-status-badge" style="display:none;"></span>
        </div>
        <p id="pv-bio" class="pv-bio"></p>

        <!-- ISTATISTIKLER -->
        <div class="pv-stats">
          <div class="pv-stat-item">
            <span id="pv-stat-posts" class="pv-stat-num">0</span>
            <span class="pv-stat-lbl">Gönderi</span>
          </div>
          <div class="pv-stat-divider"></div>
          <div class="pv-stat-item">
            <span id="pv-stat-followers" class="pv-stat-num">0</span>
            <span class="pv-stat-lbl">Takipçi</span>
          </div>
          <div class="pv-stat-divider"></div>
          <div class="pv-stat-item">
            <span id="pv-stat-following" class="pv-stat-num">0</span>
            <span class="pv-stat-lbl">Takip</span>
          </div>
        </div>

        <!-- AKSIYON BUTONU -->
        <button id="pv-action-btn" class="pv-action-btn">Takip Et</button>
      </div>

    </aside>

    <!-- SAG: Gonderiler -->
    <main class="pv-main">
      <div class="pv-posts-header">
        <span id="pv-posts-title" class="pv-posts-title">Gönderiler</span>
      </div>
      <div id="pv-posts-list" class="pv-posts-list">
        <div class="pv-empty">Henüz gönderi yok.</div>
      </div>
    </main>

  </div>

  <div id="pv-toast" class="pv-toast-container"></div>

  <script src="js/data-store.js"></script>
  <script src="js/profile-view.js"></script>
</body>

</html>

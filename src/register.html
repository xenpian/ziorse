<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziorse - Kayıt Ol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bebas+Neue&family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Fira+Code:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Orbitron:wght@600;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Pacifico&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700;800&family=Press+Start+2P&family=Righteous&family=Russo+One&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('ziorse_theme') || localStorage.getItem('ziorse_theme_v14') || localStorage.getItem('ziorse_theme_preference');
        if (t === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch(e) {}
    })();
  </script>
  <script src="js/lib/lucide.min.js"></script>
</head>

<body class="auth-body">

  <!-- MERKEZ KART -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-card-header">
        <div class="auth-brand">ZIORSE</div>
        <h1 class="auth-title">Hesap Oluştur</h1>
        <p class="auth-subtitle">Ziorse topluluğuna katılmak için formu doldur.</p>
      </div>

      <div class="auth-form">

        <div id="auth-error" class="auth-error"></div>

        <div class="auth-field">
          <label class="auth-label" for="reg-name">İsim Soyisim</label>
          <input type="text" id="reg-name" class="auth-input" placeholder="Adınız Soyadınız" autocomplete="name">
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-handle">Kullanıcı Adı</label>
          <input type="text" id="reg-handle" class="auth-input" placeholder="@kullanici" autocomplete="username">
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-email">E-Posta Adresi</label>
          <input type="email" id="reg-email" class="auth-input" placeholder="ornek@ziorse.dev" autocomplete="email">
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-password">Şifre</label>
          <input type="password" id="reg-password" class="auth-input" placeholder="En az 6 karakter"
            autocomplete="new-password">
        </div>

        <button id="btn-register-submit" class="auth-submit-btn">Kayıt Ol</button>

        <div class="auth-divider"></div>

        <p class="auth-footer">
          Zaten hesabın var mı?
          <a href="login.html">Giriş Yap</a>
        </p>

      </div>
    </div>
  </div>

  <div id="auth-toast" class="auth-toast-container"></div>

  <script src="js/data-store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => initRegister());
  </script>
</body>

</html>

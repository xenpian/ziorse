[package]
name = "ziorse-native-engine"
version = "0.1.0"
edition = "2021"
authors = ["Ziorse Team"]
description = "High-performance Rust Native Acceleration Engine for Ziorse Desktop Social Network"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Node.js N-API bindings for direct 0ms IPC with Electron
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8" # Multi-threaded parallel processing

[build-dependencies]
napi-build = "2.1"
